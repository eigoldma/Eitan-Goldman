<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #todo-form { margin-bottom: 20px; }
        #todo-list { list-style-type: none; padding: 0; }
        .todo-item { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <div id="todo-form">
        <input type="text" id="todo-input" placeholder="Add a new task..." />
        <button id="add-todo">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <script>
        const todoInput = document.getElementById('todo-input');
        const addTodoButton = document.getElementById('add-todo');
        const todoList = document.getElementById('todo-list');

        // Load todos from local storage
        const todos = JSON.parse(localStorage.getItem('todos')) || [];
        todos.forEach(todo => addTodoToDOM(todo));

        addTodoButton.addEventListener('click', () => {
            const todoText = todoInput.value;
            if (todoText) {
                addTodoToDOM(todoText);
                todos.push(todoText);
                localStorage.setItem('todos', JSON.stringify(todos));
                todoInput.value = '';
            }
        });

        function addTodoToDOM(todo) {
            const listItem = document.createElement('li');
            listItem.className = 'todo-item';
            listItem.innerHTML = `<span>${todo}</span><button class='remove-todo'>x</button>`;
            todoList.appendChild(listItem);

            // Remove todo
            listItem.querySelector('.remove-todo').addEventListener('click', function() {
                const index = todos.indexOf(todo);
                if (index > -1) {
                    todos.splice(index, 1);
                    localStorage.setItem('todos', JSON.stringify(todos));
                    todoList.removeChild(listItem);
                }
            });
        }
    </script>
</body>
</html>
